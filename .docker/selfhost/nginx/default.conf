upstream affine_backend {
    server affine:3010;
}

upstream chatbot_backend {
    server chatbot:3099;
}

server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── Chatbot API & Widget ──────────────────────────────────
    # Proxy /chatbot/* → chatbot container:3099
    location /chatbot/ {
        proxy_pass         http://chatbot_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    # ── AFFiNE App ───────────────────────────────────────────
    location / {
        proxy_pass         http://affine_backend;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Inject Chat Widget ───────────────────────────────
        # Must disable gzip from upstream so sub_filter works
        proxy_set_header   Accept-Encoding   "";

        sub_filter '</head>'
            '<link rel="stylesheet" href="/chatbot/widget/chat-widget.css">'
            '<script src="/chatbot/widget/chat-widget.js" defer></script>'
            '</head>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}
